services:
  db:
    image: postgres:16-alpine
    container_name: socialtush-db
    environment:
      POSTGRES_DB: socialtush
      POSTGRES_USER: socialtush_user
      POSTGRES_PASSWORD: socialtush_secure_pass
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - socialtush-network
    restart: unless-stopped

  cache:
    image: redis:7-alpine
    container_name: socialtush-cache
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - socialtush-network
    restart: unless-stopped

  storage:
    image: minio/minio:latest
    container_name: socialtush-storage
    environment:
      MINIO_ROOT_USER: socialtush_minio_admin
      MINIO_ROOT_PASSWORD: socialtush_minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    networks:
      - socialtush-network
    restart: unless-stopped

  createbuckets:
    image: minio/mc:latest
    container_name: socialtush-storage-init
    depends_on:
      - storage
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/curl -s --connect-timeout 2 http://storage:9000/minio/health/live); do echo 'Waiting for MinIO...'; sleep 1; done;
      /usr/bin/mc alias set localminio http://storage:9000 socialtush_minio_admin socialtush_minio_secret;
      /usr/bin/mc mb localminio/socialtush-media;
      /usr/bin/mc anonymous set public localminio/socialtush-media;
      echo 'MinIO Bucket socialtush-media created and set to public';
      exit 0;
      "
    networks:
      - socialtush-network

networks:
  socialtush-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  miniodata:
    driver: local

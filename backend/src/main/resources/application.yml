server:
  port: ${BACKEND_PORT:8080}

spring:
  application:
    name: socialtush-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:socialtush}
    username: ${DB_USER:socialtush_user}
    password: ${DB_PASSWORD:socialtush_secure_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# Custom application properties
app:
  jwt:
    secret: ${JWT_SECRET:super-secure-and-extremely-long-random-string-for-jwt-signing-key-32-bytes-minimum-required}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:socialtush_minio_admin}
    secret-key: ${MINIO_SECRET_KEY:socialtush_minio_secret}
    bucket-name: ${MINIO_BUCKET_NAME:socialtush-media}
    public-url: ${MINIO_PUBLIC_URL:http://localhost:9000/socialtush-media}

server:
  port: ${BACKEND_PORT:8080}

spring:
  application:
    name: socialtush-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:socialtush}
    username: ${DB_USER:socialtush_user}
    password: ${DB_PASSWORD:socialtush_secure_pass}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  jwt:
    secret: ${JWT_SECRET:super-secure-and-extremely-long-random-string-for-jwt-signing-key-32-bytes-minimum-required}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

  web-url: "${APP_WEB_URL:https://social-tush.vercel.app}"

  mail:
    resend-api-key: "${RESEND_API_KEY:}"
    from: "${MAIL_FROM:Lifonk <onboarding@resend.dev>}"

  account:
    email-verification-expiration-minutes: ${EMAIL_VERIFICATION_EXPIRATION_MINUTES:1440}
    password-reset-expiration-minutes: ${PASSWORD_RESET_EXPIRATION_MINUTES:20}
    action-cooldown-seconds: ${ACCOUNT_ACTION_COOLDOWN_SECONDS:60}

  storage:
    endpoint: ${APP_STORAGE_ENDPOINT:${MINIO_ENDPOINT:http://localhost:9000}}
    access-key: ${APP_STORAGE_ACCESS_KEY:${MINIO_ACCESS_KEY:socialtush_minio_admin}}
    secret-key: ${APP_STORAGE_SECRET_KEY:${MINIO_SECRET_KEY:socialtush_minio_secret}}
    bucket-name: ${APP_STORAGE_BUCKET_NAME:${MINIO_BUCKET_NAME:socialtush-media}}
    public-url: ${APP_STORAGE_PUBLIC_URL:${MINIO_PUBLIC_URL:http://localhost:9000/socialtush-media}}

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

app:
  jwt:
    secret: test-super-secure-and-extremely-long-random-string-for-jwt-signing-key-32-bytes-minimum-required
    access-expiration-ms: 900000
    refresh-expiration-ms: 604800000
  storage:
    endpoint: http://localhost:9000
    access-key: minio
    secret-key: minio
    bucket-name: test
    public-url: http://localhost:9000/test

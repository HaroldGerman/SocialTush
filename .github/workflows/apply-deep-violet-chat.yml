name: Apply safe Deep Violet chat rename

on:
  push:
    paths:
      - '.github/workflows/apply-deep-violet-chat.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply verified chat page
        shell: bash
        run: |
          cat .github/tmp/deep-violet-0.b64 .github/tmp/deep-violet-1.b64 .github/tmp/deep-violet-2.b64 > /tmp/chat-page.gz.b64
          base64 --decode /tmp/chat-page.gz.b64 | gzip --decompress > web/src/app/chat/page.tsx
          git rm .github/tmp/deep-violet-0.b64 .github/tmp/deep-violet-1.b64 .github/tmp/deep-violet-2.b64 .github/workflows/apply-deep-violet-chat.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/app/chat/page.tsx
          git diff --cached --check
          git commit -m "Rename deep teal chat theme safely to deep violet"
          git push origin HEAD:main

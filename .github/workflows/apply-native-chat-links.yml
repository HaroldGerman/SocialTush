name: Apply native chat link rendering

on:
  push:
    paths:
      - '.github/workflows/apply-native-chat-links.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch chat rendering
        run: |
          python - <<'PY'
          from pathlib import Path

          chat = Path('web/src/app/chat/page.tsx')
          text = chat.read_text()

          import_anchor = "import UserAvatar from '@/components/UserAvatar';\n"
          import_line = "import ChatMessageContent from '@/components/ChatMessageContent';\n"
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('Chat import anchor not found')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          old = "{message.content && message.messageType !== 'STORY_REACTION' && <p className=\"whitespace-pre-wrap\">{message.content}</p>}"
          new = "{message.content && message.messageType !== 'STORY_REACTION' && <ChatMessageContent content={message.content} own={isOwn} />}"
          if old not in text and new not in text:
              raise SystemExit('Message render anchor not found')
          text = text.replace(old, new, 1)
          chat.write_text(text)

          layout = Path('web/src/app/layout.tsx')
          layout_text = layout.read_text()
          layout_text = layout_text.replace('import ChatLinkPreviewEnhancer from "@/components/ChatLinkPreviewEnhancer";\n', '')
          layout_text = layout_text.replace('          <ChatLinkPreviewEnhancer />\n', '')
          layout.write_text(layout_text)
          PY
      - name: Commit native chat rendering
        run: |
          git config user.name "lifonk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/src/app/chat/page.tsx web/src/app/layout.tsx
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Render chat links natively in React"
          git push origin HEAD:main

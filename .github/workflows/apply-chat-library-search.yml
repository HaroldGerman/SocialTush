name: Apply chat library and search improvements

on:
  push:
    paths:
      - '.github/workflows/apply-chat-library-search.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch chat library and search
        run: |
          sed -i 's/const filteredConversations/const sendTypingSignal/' .github/scripts/chat_library_search_patch.py
          python .github/scripts/chat_library_search_patch.py
      - name: Validate web build
        working-directory: web
        env:
          NEXT_PUBLIC_API_URL: https://api.lifonk.social/api/v1
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit improvements
        run: |
          git config user.name "lifonk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/src/app/chat/page.tsx
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Fix complete chat library and in-chat search"
          git push origin HEAD:main

name: Validate SocialTush

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile backend
        run: mvn -B clean package -DskipTests

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        # package-lock.json predates npm 10's @emnapi optional dependency resolution.
        # npm install refreshes the dependency tree in CI so we can still validate Next/TypeScript.
        run: npm install --no-audit --no-fund
      - name: Build web
        env:
          NEXT_PUBLIC_API_URL: https://socialtush-production.up.railway.app/api/v1
        run: npm run build
